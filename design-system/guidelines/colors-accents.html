<!-- @dsCard group="Colors" viewport="700x210" subtitle="Two accents with separate jobs, red for one thing only" name="Accents" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--tc-graphite);font-family:var(--font-body);color:var(--tc-bone);display:flex;gap:14px;padding:22px;box-sizing:border-box;height:210px}
.sw{flex:1;border-radius:var(--r-card);background:var(--tc-panel);padding:14px;display:flex;flex-direction:column;gap:8px}
.chip{height:40px;border-radius:6px}
.tok{font-family:var(--font-data);font-size:12px;font-weight:500}
.hex{font-family:var(--font-data);font-size:11px;color:var(--tc-bone-55)}
.use{font-size:11px;line-height:1.45;color:var(--tc-bone-70)}
</style>
</head><body>
<div class="sw"><div class="chip" style="background:var(--tc-signal)"></div><span class="tok">--tc-signal</span><span class="hex">#FF9E2C</span><span class="use">Playing, active, energy. The playhead, the on-beat pulse.</span></div>
<div class="sw"><div class="chip" style="background:var(--tc-cool)"></div><span class="tok">--tc-cool</span><span class="hex">#4FB8C4</span><span class="use">You chose this — selection, confirmation. Also the material color of video clips.</span></div>
<div class="sw"><div class="chip" style="background:var(--tc-clip)"></div><span class="tok">--tc-clip</span><span class="hex">#E23D28</span><span class="use">Destructive and over-limit only. Never decorative. Red means you've gone too far.</span></div>
</body></html>
