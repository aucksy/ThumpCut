<!-- @dsCard group="Colors" viewport="700x190" subtitle="Graphite, panel, bone — warm surfaces, never pure black" name="Surfaces & text" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:#101113;font-family:var(--font-body);display:flex;gap:14px;padding:22px;box-sizing:border-box;height:190px}
.sw{flex:1;border-radius:var(--r-card);padding:14px;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;border:1px solid var(--tc-bone-12)}
.tok{font-family:var(--font-data);font-size:12px;font-weight:500}
.hex{font-family:var(--font-data);font-size:11px;opacity:.55}
.use{font-size:11px;opacity:.6;margin-top:2px}
</style>
</head><body>
<div class="sw" style="background:var(--tc-graphite);color:var(--tc-bone)"><span class="tok">--tc-graphite</span><span class="hex">#17181A</span><span class="use">App background. Warm-tinted, never pure black.</span></div>
<div class="sw" style="background:var(--tc-panel);color:var(--tc-bone)"><span class="tok">--tc-panel</span><span class="hex">#23252A</span><span class="use">Cards, sheets, raised surfaces.</span></div>
<div class="sw" style="background:var(--tc-bone);color:var(--tc-graphite);border-color:transparent"><span class="tok">--tc-bone</span><span class="hex">#EAE6DE</span><span class="use">Primary text &amp; icons. Label print.</span></div>
</body></html>
