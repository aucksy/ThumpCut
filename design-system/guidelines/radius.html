<!-- @dsCard group="Spacing" viewport="700x170" subtitle="8pt cards, 4pt chips — hardware isn't pillowy" name="Radius" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--tc-graphite);font-family:var(--font-body);color:var(--tc-bone);display:flex;align-items:center;gap:24px;padding:24px 32px;box-sizing:border-box;height:170px}
.lab{font-family:var(--font-data);font-size:11px;color:var(--tc-bone-55);margin-top:8px;text-align:center}</style>
</head><body>
<div><div style="width:150px;height:90px;background:var(--tc-panel);border-radius:var(--r-card);border:1px solid var(--tc-bone-12)"></div><div class="lab">card &middot; 8pt</div></div>
<div><div style="width:90px;height:36px;background:var(--tc-panel);border-radius:var(--r-chip);border:1px solid var(--tc-bone-12)"></div><div class="lab">chip &middot; 4pt</div></div>
<div style="font-size:12px;line-height:1.55;color:var(--tc-bone-70);max-width:260px">Two radii in the whole product. Sheets use the card radius on their top corners. Nothing is a pill except nothing.</div>
</body></html>
