<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--tc-graphite);color:var(--tc-bone);font-family:var(--font-body);display:flex;flex-direction:column;justify-content:center;gap:26px;padding:28px 40px;box-sizing:border-box;height:240px}
.wm{display:flex;align-items:baseline;font-family:var(--font-display);font-weight:800;font-stretch:80%;letter-spacing:-.02em;line-height:1}
.tick{display:inline-block;width:.09em;height:.74em;background:var(--tc-signal);border-radius:.05em;margin:0 .07em;transform:translateY(.06em)}
</style>
</head><body>
<div class="wm" style="font-size:58px">Thump<span class="tick"></span>cut</div>
<div style="display:flex;align-items:center;gap:14px">
  <img src="../assets/logo-mark.svg" width="40" height="40" alt="">
  <div class="wm" style="font-size:26px">Thump<span class="tick"></span>cut</div>
  <div class="tc-data" style="font-size:11px;color:var(--tc-bone-35);margin-left:22px">Archivo 800 &middot; 80% width &middot; -0.02em &middot; the tick sits on the beat between the words</div>
</div>
</body></html>
