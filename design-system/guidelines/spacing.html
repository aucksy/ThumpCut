<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--tc-graphite);font-family:var(--font-data);color:var(--tc-bone);display:flex;align-items:flex-end;gap:20px;padding:24px 32px 28px;box-sizing:border-box;height:180px}
.s{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;color:var(--tc-bone-55)}
.bar{width:26px;background:var(--tc-cool-12);border:1px solid var(--tc-cool-50);border-radius:3px}
</style>
</head><body>
<div class="s"><div class="bar" style="height:4px"></div>4</div>
<div class="s"><div class="bar" style="height:8px"></div>8</div>
<div class="s"><div class="bar" style="height:12px"></div>12</div>
<div class="s"><div class="bar" style="height:16px"></div>16</div>
<div class="s"><div class="bar" style="height:20px"></div>20</div>
<div class="s"><div class="bar" style="height:24px"></div>24</div>
<div class="s"><div class="bar" style="height:32px"></div>32</div>
<div class="s"><div class="bar" style="height:40px"></div>40</div>
<div class="s"><div class="bar" style="height:56px"></div>56</div>
<div style="font-family:var(--font-body);font-size:11px;color:var(--tc-bone-35);margin-left:16px;line-height:1.5">gutter 20px<br>tap target ≥ 44pt</div>
</body></html>
