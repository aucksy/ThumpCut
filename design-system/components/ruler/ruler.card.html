<!-- @dsCard group="Components" viewport="700x330" subtitle="The signature element — idle, playing, reduced motion, compressed" name="Beat ruler" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../tc-loader.js"></script>
<style>body{margin:0;background:var(--tc-graphite);padding:22px 26px;box-sizing:border-box;font-family:var(--font-body)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
TCLoad('..', ['BeatRuler.jsx']).then(({BeatRuler}) => {
  const Cap = ({children}) => <div className="tc-label" style={{fontSize:10,marginBottom:6}}>{children}</div>;
  ReactDOM.createRoot(document.getElementById('root')).render(
    <div style={{display:'flex',flexDirection:'column',gap:18}}>
      <div><Cap>Idle</Cap><BeatRuler height={40} seed={3}/></div>
      <div><Cap>Playing — playhead sweeps, markers pulse 120ms on hit</Cap><BeatRuler height={40} seed={3} playing/></div>
      <div><Cap>Reduced motion — playhead stays, pulses off</Cap><BeatRuler height={40} seed={3} playing reduced/></div>
      <div><Cap>Compressed 4px — template cards</Cap><BeatRuler compressed beats={24} seed={2}/></div>
      <div style={{display:'flex',gap:16,fontFamily:'var(--font-data)',fontSize:11,color:'var(--tc-bone-55)'}}>
        <span><span style={{display:'inline-block',width:5,height:5,borderRadius:1.5,background:'var(--tc-bone)',marginRight:5}}></span>photo cut</span>
        <span><span style={{display:'inline-block',width:5,height:11,borderRadius:2.5,background:'var(--tc-cool)',marginRight:5,verticalAlign:'-2px'}}></span>video cut</span>
        <span style={{color:'var(--tc-signal)'}}>| playhead</span>
      </div>
    </div>
  );
});
</script>
</body></html>
