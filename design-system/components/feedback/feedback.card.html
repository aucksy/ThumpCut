<!-- @dsCard group="Components" viewport="700x300" subtitle="Toast, inline hint, track substitution notice — exact product copy" name="Feedback" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../tc-loader.js"></script>
<style>body{margin:0;background:var(--tc-graphite);padding:22px 26px;box-sizing:border-box;font-family:var(--font-body)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
TCLoad('../..', ['components/feedback/Toast.jsx','components/feedback/InlineHint.jsx','components/feedback/TrackNotice.jsx']).then(({Toast, InlineHint, TrackNotice}) => {
  ReactDOM.createRoot(document.getElementById('root')).render(
    <div style={{display:'flex',gap:24}}>
      <div style={{display:'flex',flexDirection:'column',gap:12,flex:1}}>
        <Toast>You can add up to 30 items.</Toast>
        <Toast>You can add up to 15 video clips.</Toast>
        <Toast>Saved to your gallery.</Toast>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:14,flex:1}}>
        <InlineHint>Pick at least 3 items.</InlineHint>
        <InlineHint tone="danger">This reel is too heavy for your phone. Try using fewer video clips.</InlineHint>
        <TrackNotice>That track isn't available anymore. Here's a similar one.</TrackNotice>
        <TrackNotice>This style needs a different number of items, so we adjusted it.</TrackNotice>
      </div>
    </div>
  );
});
</script>
</body></html>
