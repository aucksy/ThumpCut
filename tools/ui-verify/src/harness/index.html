<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThumpCut UI harness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Public+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500;600&display=block"
      rel="stylesheet"
    />
    <style>
      /* The app names its families the way React Native does. These aliases point those names
         at the real faces, with a local fallback so the harness still renders something
         sensible on a machine with no network. Screenshots in the wrong typeface are
         screenshots nobody can judge. */
      @font-face {
        font-family: "Archivo";
        src: local("Archivo"), local("Archivo Black"), local("Arial Narrow Bold"), local("Impact");
        font-weight: 700;
        font-stretch: 80%;
      }
      @font-face {
        font-family: "PublicSans";
        src: local("Public Sans"), local("Segoe UI"), local("Helvetica Neue"), local("Arial");
      }
      @font-face {
        font-family: "JetBrainsMono";
        src: local("JetBrains Mono"), local("Cascadia Mono"), local("Consolas"),
          local("DejaVu Sans Mono"), local("Courier New");
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0e0f11;
        font-family: "PublicSans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      }
      #root {
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
      }
      * {
        -webkit-font-smoothing: antialiased;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
