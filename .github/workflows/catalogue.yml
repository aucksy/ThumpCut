name: Catalogue

# Publishes the song list and beat maps to GitHub Pages, which is where the app fetches them
# from. Free, static, no bucket, no account — it is exactly the "static host and a public URL"
# that OPEN-QUESTIONS asks for, so the app has somewhere to point until a real one exists.
#
# With no Meta credentials the Factory runs in fixture mode and publishes three test tracks at
# 96, 124 and 150 BPM, credited to "ThumpCut Test Kit" so nobody mistakes them for real music.
# Everything except "do the cuts land on the beat of a real Instagram track" can be tested
# against them.
#
# Set META_ACCESS_TOKEN as a repository secret and this same workflow publishes the real
# catalogue instead, with no other change.

on:
  push:
    branches: [main]
    paths:
      - "factory/**"
      - ".github/workflows/catalogue.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: catalogue
  cancel-in-progress: false

jobs:
  build:
    name: Generate it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --quiet numpy

      - name: Run the Factory
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python -m factory.run --no-upload --out site --tmp "$RUNNER_TEMP/tmp"
          # P1 — no audio may survive a run.
          test -z "$(ls -A "$RUNNER_TEMP/tmp" 2>/dev/null)" || (echo "audio left on disk" && exit 1)
          # Pages would otherwise run the whole thing through Jekyll.
          touch site/.nojekyll
          echo "Publishing:"
          find site -type f | sort

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on the first time, so this needs no visit to repository settings.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Put it online
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
