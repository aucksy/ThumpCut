name: Catalogue

# Keeps the published song list and beat maps in step with the Factory.
#
# The catalogue lives in the repository, under `catalogue/`, and is served to phones straight
# from GitHub by jsDelivr — a free CDN that mirrors public repositories and, unlike GitHub's
# own raw file host, serves JSON with a JSON content type. The app rejects anything else,
# because a hotel wifi login page also answers with a 200.
#
# That choice buys one thing that matters more than elegance here: **nothing has to be
# switched on by hand.** GitHub Pages would be the tidier home, but it cannot be enabled by a
# workflow — it needs someone to visit repository settings, and the owner should not have to.
#
# With no Meta credentials the Factory runs in fixture mode and produces three test tracks at
# 96, 124 and 150 BPM, credited to "ThumpCut Test Kit" so nobody mistakes them for real music.
# Add META_ACCESS_TOKEN as a repository secret and this same workflow publishes the real
# catalogue instead, with no other change.

on:
  push:
    branches: [main]
    paths:
      - "factory/**"
      - ".github/workflows/catalogue.yml"
  schedule:
    # Every six hours, for one reason: the preview plays the real track, and Instagram's audio
    # links expire in about a day and a half. A timed run refreshes the links **only** — it
    # fetches no audio, touches no beat map and cannot retire a track. With no
    # META_ACCESS_TOKEN it produces the same three test-track links it always does, notices
    # nothing changed, and commits nothing.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogue
  cancel-in-progress: false

jobs:
  publish:
    name: Regenerate and commit it
    runs-on: ubuntu-latest
    # Secrets land in the job's environment once, and every step — including step `if`
    # conditions — reads `env`, never `secrets`. GitHub's expression parser does not allow
    # the secrets context inside a step-level `if`; a workflow that tries is refused at
    # parse time, before any job exists, and the failure is only visible as an "Invalid
    # workflow file" annotation nobody is looking for. That exact mistake silently stopped
    # every catalogue run between 09:48 and 12:42 UTC on 2026-08-02.
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      # One free key from devportal.jamendo.com switches the royalty-free section on. Its
      # links never expire, but the audio index is rebuilt whole, so the section has to be
      # present in every refresh or its entries would silently vanish.
      JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --quiet numpy

      - name: Check the Meta token before using it
        # So a token problem reads as "switch the Instagram account to Professional" rather
        # than as a stack trace three steps later. Skipped entirely when there is no token —
        # fixture mode is a valid way to run.
        if: ${{ env.META_ACCESS_TOKEN != '' }}
        run: python -m factory.check_meta

      - name: Refresh the preview's audio links
        # The timed run, and all it does. No audio is fetched, no beat map is touched, and
        # nothing can be retired — the links are the only thing that goes stale in six hours.
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          python -m factory.run --links-only --out catalogue

      - name: Run the Factory
        if: github.event_name != 'schedule'
        run: |
          set -euo pipefail
          # The previous catalogue is deliberately left in place rather than deleted first.
          # Two things depend on it: the Factory re-verifies a recording against the beat map
          # it already has instead of re-analysing every track from scratch, and it can leave
          # `generatedAt` alone when the content is identical — which is what stops a run that
          # changed nothing from committing. Retiring a track is handled by the publish step,
          # which swaps a whole new beat map directory into place, so nothing stale survives.
          python -m factory.run --no-upload --out catalogue --tmp "$RUNNER_TEMP/tmp"
          # P1 — no audio may survive a run.
          test -z "$(ls -A "$RUNNER_TEMP/tmp" 2>/dev/null)" || (echo "audio left on disk" && exit 1)
          find catalogue -type f | sort

      - name: Commit it if it changed
        id: commit
        run: |
          set -euo pipefail
          # Only these two files decide. Every beat map carries a `lastVerifiedAt` that moves
          # on every run by design, so on a six-hourly timer "did any file change" is always
          # yes and the repository fills with commits that changed nothing anyone can observe.
          # `catalogueHash` covers every track's content hash and `indexHash` covers every
          # audio link, so if both are unchanged, no phone can tell this run happened.
          if git diff --quiet -- catalogue/catalogue.json catalogue/audio.json; then
            echo "Nothing a phone could see has changed."
            git checkout -- catalogue
            echo "changed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue
          # [skip ci] so republishing the catalogue does not kick off another APK build,
          # which would republish the catalogue, which would...
          git commit -m "Republish the catalogue [skip ci]"
          git push
          echo "changed=yes" >> "$GITHUB_OUTPUT"

      - name: Tell the CDN the audio links moved
        # The app fetches audio.json from the branch rather than from a commit, because a phone
        # holding an app built last month still has to be able to get a link issued this
        # morning. jsDelivr holds a branch file at its edge for twelve hours, which is most of
        # the life of an Instagram audio link. This drops that copy immediately, so a refresh
        # published now is what the next phone actually gets.
        #
        # Free, needs no account and no token. A failure here costs freshness, not correctness
        # — the app checks the expiry on every link before it plays it — so it never fails the
        # run.
        if: steps.commit.outputs.changed == 'yes'
        continue-on-error: true
        run: |
          for path in catalogue/audio.json catalogue/catalogue.json; do
            url="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/${path}"
            echo "Purging $path"
            curl --silent --show-error --max-time 30 "$url" || echo "  purge did not answer"
            echo
          done
