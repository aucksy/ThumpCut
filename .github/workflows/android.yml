name: Android APK

# Builds an installable Android app on every push to main and publishes it as a GitHub
# Release, so it can be downloaded straight onto a phone from the browser. Nothing here
# needs a laptop, an Android SDK, or an Expo account.
#
# This is a *release* build, not a development build: the JavaScript is compiled into the
# APK. A development build would need Metro running on a computer on the same network, which
# defeats the point.
#
# It is signed with the standard Android debug key, which is fixed and identical on every
# run — so a new build installs over the top of the old one rather than demanding an
# uninstall. That key is fine for testing and must never be used for the Play Store.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

env:
  # One tag, reused. The download link never changes.
  RELEASE_TAG: latest-android
  # Instagram silently ignores a share with no application id. Until this is set the share
  # button is absent rather than broken — see app/app/share.tsx.
  EXPO_PUBLIC_META_APP_ID: ${{ secrets.META_APP_ID }}

jobs:
  apk:
    name: Build the APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/package.json', 'package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Every linked native module is on this SDK
        # Before anything is built, not just alongside it. A package from another SDK compiles
        # perfectly and then kills the app on launch, and an APK that cannot open is worse than
        # no APK at all — it costs somebody a download, an install and their patience.
        run: npm run check:native

      - name: Number this build
        run: |
          version=$(node -p "require('./app/package.json').version || '1.0.0'")
          echo "THUMPCUT_BUILD=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "APK_NAME=ThumpCut-${version}-b${GITHUB_RUN_NUMBER}.apk" >> "$GITHUB_ENV"
          echo "APP_VERSION=${version}" >> "$GITHUB_ENV"
          echo "This is build ${GITHUB_RUN_NUMBER} of ${version}"

      - name: Point the app at this commit's catalogue
        # Pinned to the commit rather than to the branch: a CDN caches a branch for hours, and
        # a phone fetching yesterday's song list against today's app is a bug nobody can see.
        # Baked in at bundle time — there is no setting to change it on the phone.
        run: |
          url="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${GITHUB_SHA}/catalogue"
          echo "EXPO_PUBLIC_CATALOGUE_URL=$url" >> "$GITHUB_ENV"
          echo "Songs will be fetched from $url"

      - name: Point the preview at the audio links
        # Deliberately NOT pinned to the commit, and deliberately a different document from the
        # song list. Instagram's audio links expire in about a day and a half, so a phone
        # holding an app built last month still has to be able to get a fresh one. Nothing in
        # here can change what songs the app offers — it is a lookup by track id, and an id the
        # app does not know is ignored. A track with no entry plays the click instead.
        run: |
          url="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/catalogue/audio.json"
          echo "EXPO_PUBLIC_AUDIO_INDEX_URL=$url" >> "$GITHUB_ENV"
          echo "Preview audio links will be fetched from $url"

      - name: Generate the native Android project
        run: npm run prebuild:android

      - name: Sign with the pinned test key
        # Prebuild writes a fresh debug keystore every time. Today it copies a fixed file out
        # of the Expo template, so the key happens to be stable — but that is Expo's packaging
        # detail, not a promise. Android refuses to install a build over one signed by a
        # different key, so the day that template changes, every tester is told to uninstall.
        # Pinning it here means that cannot happen. See ci/README.md.
        run: |
          cp ci/thumpcut-test.keystore app/android/app/debug.keystore
          echo "Signing key pinned: $(sha256sum app/android/app/debug.keystore | cut -c1-16)…"

      - name: Give Gradle enough heap for a release build
        # The template ships 2GB, which is fine on a workstation and marginal here. Last
        # entry in the file wins. The leading newline is not optional: the generated file ends
        # without one, so a plain append glues this onto `android.targetSdkVersion=35`.
        run: printf '\norg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g\n' >> app/android/gradle.properties

      - name: Build
        working-directory: app/android
        # Phone architectures only. Dropping the two emulator ones roughly halves the file
        # the owner has to download over mobile data.
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Leave the build log somewhere readable
        if: failure()
        # Action logs need a GitHub login to read, which makes a failed cloud build hard to
        # diagnose from outside. The tail of the log goes to a branch nobody else looks at.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          tail -n 1500 "$RUNNER_TEMP/gradle.log" > "$work/android-build.log"
          cd "$work"
          git init -q
          git checkout -q -b ci-logs
          git add android-build.log
          git -c user.name=ci -c user.email=ci@thumpcut.invalid \
            commit -qm "Android build log for ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs

      - name: Collect it
        id: collect
        run: |
          set -euo pipefail
          built=$(find app/android/app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$built" ]; then
            echo "No APK was produced." >&2
            exit 1
          fi
          mkdir -p out
          cp "$built" "out/${APK_NAME}"
          size=$(du -h "out/${APK_NAME}" | cut -f1)
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "Built ${APK_NAME} ($size)"

      - name: Keep a copy against this run
        uses: actions/upload-artifact@v4
        with:
          name: ThumpCut-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish it where a phone can reach it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=$(cat <<NOTES
          **Tap \`${APK_NAME}\` below on your phone to install it.**

          Version ${APP_VERSION}, build ${GITHUB_RUN_NUMBER} — ${{ steps.collect.outputs.size }}
          From \`${GITHUB_SHA:0:7}\`: $(git log -1 --pretty=%s)

          Signed with the project's fixed test key, so it installs straight over whatever
          build you already have — no uninstall, nothing lost. Android will warn you it is
          from an unknown developer; that is expected for anything not from the Play Store.

          To check which build you are running: **Settings → Apps → ThumpCut**, and look at
          the version.
          NOTES
          )
          # Replaced rather than added to, so the download link is always the newest build.
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
          gh release create "$RELEASE_TAG" "out/${APK_NAME}" \
            --target "$GITHUB_SHA" \
            --title "ThumpCut ${APP_VERSION} — build ${GITHUB_RUN_NUMBER}" \
            --notes "$notes" \
            --latest
